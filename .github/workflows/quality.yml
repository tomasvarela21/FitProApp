name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitpro_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fitpro_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitpro_ci_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitpro_ci_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitpro_ci_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Auditar dependencias de producción
        run: npm run audit:production
      - run: npx prisma validate
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:all
